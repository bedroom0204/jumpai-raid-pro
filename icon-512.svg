<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#131C31" />
      <stop offset="100%" stop-color="#060A12" />
    </radialGradient>
    <linearGradient id="neonLime" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B4FF39" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#1E293B" stroke-width="4" />
  <rect width="496" height="496" x="8" y="8" rx="104" fill="none" stroke="url(#neonLime)" stroke-opacity="0.25" stroke-width="2" />

  <!-- Shield / Crest Outline -->
  <path d="M256 70 L390 130 C390 280 256 390 256 420 C256 390 122 280 122 130 Z" 
        fill="#0B1120" stroke="url(#neonCyan)" stroke-width="8" stroke-linejoin="round" opacity="0.85" />

  <!-- Jump Rope Arc Wave -->
  <path d="M110 320 Q256 460 402 320" fill="none" stroke="url(#neonLime)" stroke-width="10" stroke-linecap="round" filter="url(#glow)" />
  <circle cx="110" cy="320" r="14" fill="#00F0FF" />
  <circle cx="402" cy="320" r="14" fill="#00F0FF" />

  <!-- Central Sword / Lightning Symbol -->
  <g filter="url(#glow)">
    <!-- Crossed Blades -->
    <path d="M190 330 L322 170 M322 330 L190 170" stroke="url(#neonLime)" stroke-width="14" stroke-linecap="round" />
    <!-- Center Bolt -->
    <polygon points="266,130 226,240 260,240 246,340 296,220 262,220" fill="#00F0FF" />
  </g>

  <!-- Star / Sparkles -->
  <circle cx="256" cy="110" r="6" fill="#B4FF39" />
  <circle cx="160" cy="200" r="4" fill="#B4FF39" opacity="0.8" />
  <circle cx="352" cy="200" r="4" fill="#B4FF39" opacity="0.8" />
</svg>
